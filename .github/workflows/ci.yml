name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: test (race, seed corpus only)
        run: go test -race -count=1 ./...
      - name: cross-compile
        if: matrix.os == 'ubuntu-latest'
        run: make release
